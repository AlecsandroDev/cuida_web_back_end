# Evolution API local para testes do CUIDA.
#
# Recomendado: v2 (validada em 30/09/2026 com envio real)
#   docker compose -f docs/docker-compose.evolution.yml --profile v2 up -d
#   Painel para conectar o WhatsApp: http://localhost:8080/manager
#
# A chave abaixo (AUTHENTICATION_API_KEY) TEM que ser igual a WHATSAPP_API_KEY do .env.
# É uma chave só para o Docker local; não use a mesma num servidor público.
services:
  # ---- Opção recomendada: v2 (use EVOLUTION_API_VERSION=v2 no .env) ----
  evolution-v2:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_v2
    restart: unless-stopped
    depends_on: [evolution-db]
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: cuida-api-sla-2026
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-db:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
    profiles: ["v2"]

  evolution-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    profiles: ["v2"]

  # ---- Legado: v1 (NÃO recomendado) ----
  # Em 30/09/2026 o WhatsApp recusou conectar a v1.8.7 ("couldn't link device").
  # A imagem também vem com uma instância de exemplo esquecida por quem a publicou.
  # Mantida só para referência; use EVOLUTION_API_VERSION=v1 se usar esta.
  evolution-v1:
    image: evoapicloud/evolution-api:v1.8.7
    container_name: evolution_v1
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: cuida-api-sla-2026
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      LOG_LEVEL: ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances
    profiles: ["v1"]

volumes:
  evolution_instances:
  evolution_pg:
